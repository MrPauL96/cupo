spring.application.name=cupo-backend
server.port=${PORT:8080}

# --- Agente (Claude vía Spring AI) ---
# Sin ANTHROPIC_API_KEY el agente responde con reglas simples (modo demo), así puedes probar todo sin clave.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:sin-clave}
spring.ai.anthropic.chat.options.model=${CUPO_MODEL:claude-haiku-5-5}
spring.ai.anthropic.chat.options.max-tokens=300
# El modelo no admite temperature: vacía para anular el 0.8 por defecto de Spring AI
spring.ai.anthropic.chat.options.temperature=
# --- Cupo ---
# Simula entradas y salidas en las talanqueras de los parqueaderos privados cada 5 s
cupo.simulator.enabled=true
# Consulta el pronóstico real de lluvia en Open-Meteo (gratis, sin clave)
cupo.weather.enabled=true
